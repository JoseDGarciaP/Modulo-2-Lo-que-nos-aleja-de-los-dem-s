<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Verificar resultado · Froggy Jumps</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#123040;background:#e3f4ee;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:18px;padding:clamp(16px,4vw,26px);box-shadow:0 8px 24px rgba(18,48,64,.12);margin-top:clamp(8px,4vh,40px)}
  h1{margin:0 0 4px;font-size:clamp(1.3rem,4vw,1.7rem);color:#3d8b3d}
  p{color:#4d6b78;margin:.3em 0 1em;line-height:1.45}
  label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 4px}
  input{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border-radius:12px;border:2px solid #bcd9d2;min-height:48px}
  input:focus{outline:none;border-color:#3d8b3d}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{margin-top:16px;width:100%;font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:12px;padding:14px;background:#3d8b3d;color:#fff;cursor:pointer;box-shadow:0 4px 0 #2a662a}
  .res{margin-top:16px;padding:14px;border-radius:12px;font-weight:800;display:none}
  .res.ok{display:block;background:#dff5e6;color:#1f6d37}
  .res.bad{display:block;background:#fbe3e3;color:#a02626}
  @media (max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🔎 Verificar resultado</h1>
    <p>Copia los datos exactamente como aparecen en el pantallazo del estudiante. Si alguien editó el nombre, los aciertos, los fallos o el puntaje, el código no va a coincidir.</p>
    <label for="nombre">Nombre</label><input id="nombre" autocomplete="off">
    <label for="id">Partida (ID)</label><input id="id" autocomplete="off" placeholder="Ej: MG5X2K1A3F">
    <div class="grid">
      <div><label for="ok">Aciertos</label><input id="ok" type="number" min="0" max="10" inputmode="numeric"></div>
      <div><label for="bad">Fallos</label><input id="bad" type="number" min="0" max="10" inputmode="numeric"></div>
    </div>
    <label for="code">Código</label><input id="code" autocomplete="off" placeholder="XXXX-XXXX">
    <button id="go">Verificar</button>
    <div class="res" id="res" aria-live="polite"></div>
  </div>
</div>
<script>
(function(){
'use strict';
const TOTAL=10, START=100, PENALTY=START/TOTAL;
const SECRET='FJ-M2-verif-árbol-nenúfar';
function cyrb(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function clean(x){return String(x).toUpperCase().replace(/O/g,'0').replace(/I/g,'1');}
function code(id,nombre,ok,bad,pts){const h=cyrb(SECRET+'|code|'+[id,nombre,ok,bad,pts].join('|')).padStart(8,'0');const c=clean(h);return c.slice(0,4)+'-'+c.slice(4,8);}
const $=id=>document.getElementById(id);
$('go').onclick=()=>{
  const nombre=$('nombre').value.trim().replace(/\s+/g,' ');
  const id=clean($('id').value.trim());
  const ok=parseInt($('ok').value,10), bad=parseInt($('bad').value,10);
  const c=clean($('code').value.trim().replace(/\s/g,''));
  const r=$('res'); r.className='res';
  if(!nombre||!id||isNaN(ok)||isNaN(bad)||!c){r.textContent='Completa todos los campos.';r.className='res bad';return;}
  if(ok+bad!==TOTAL){r.textContent='❌ No válido: aciertos + fallos debe sumar '+TOTAL+'.';r.className='res bad';return;}
  const pts=Math.round(Math.max(0,START-bad*PENALTY)*100)/100;
  if(code(id,nombre,ok,bad,pts)===c){
    r.textContent='✅ Resultado auténtico: '+nombre+' · '+ok+' aciertos · '+bad+' fallos · '+pts.toLocaleString('es-CO')+' puntos.';r.className='res ok';
  }else{
    r.textContent='❌ El código no coincide. Revisa que copiaste bien los datos; si están bien, el pantallazo fue alterado.';r.className='res bad';
  }
};
})();
</script>
</body>
</html>
